training:
  batch_size: 64
  epochs: 3
  lr: 0.1   # {SGD: 0.1, Adam: 0.001}
  optim_name: SGD   # SGD or Adam
  model_name: eenet34_51015_quarter    # eenet20_half, eenet34_1525_quarter, eenet34_51015_quarter
  dataset: CIFAR10   # [MNIST, CIFAR10, CIFAR100]
  num_ee: 4  # [2, 4, 8]
  distribution: pareto  # [pareto, linear, fine] # exitの分布を決定するパラメータ
  loss_func: v2  # [v1, v2, v3]
  zero_init_residual: False  # bool # 初期化方法の違いによる性能差を評価するためのフラグ
  exit_plot_num: 10000  # 結果のプロット数

FL:
  global_rounds: 50
  num_clients: 20
  dirichlet: 10000000000   # [0.5, 10000000000]
  ite_num: 5
  cohort: 5
  mode: random
